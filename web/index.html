<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="kier-api-base" content="http://127.0.0.1:5056/api/">
  <meta name="theme-color" content="#123d38"><title>KIER 재생에너지 통합조회</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-minimap@3.6.1/dist/Control.MiniMap.min.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="https://unpkg.com/leaflet-minimap@3.6.1/dist/Control.MiniMap.min.js"></script>
  <script defer src="region-geometry.js"></script>
  <script defer src="regions.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <!-- Hidden stubs required by app.js (sidebar is removed) -->
  <div class="js-compat" hidden>
    <input id="select-all" type="checkbox">
    <div id="datasets"></div>
    <select id="filter-dataset"></select>
    <label id="metric-label" for="metric"></label>
    <select id="metric" disabled><option value=""></option></select>
    <div id="extra-filters"></div>
    <div id="dataset-filters"></div>
    <select id="region-province" disabled><option></option></select>
    <select id="region-district" disabled><option></option></select>
    <select id="region-town" disabled><option></option></select>
    <p id="region-status"></p>
    <button id="region-retry" type="button"></button>
    <input id="boundary-district" type="checkbox" checked>
    <input id="boundary-town" type="checkbox" checked>
    <div id="single-dataset-row"><span id="result-dataset"></span><span id="result-item"></span></div>
    <div class="value-block">
      <span id="result-state"></span>
      <div id="value">—</div>
      <span id="unit"></span>
    </div>
    <div id="single-period-row"><dd id="result-period"></dd></div>
    <p id="boundary-error"></p>
    <span id="boundary-source"></span>
    <a id="boundary-source-link"></a>
  </div>

  <main>
    <div class="workspace">
      <div class="map-wrap">
        <div id="map" aria-label="지점 선택 지도"></div>
        <div id="map-error" role="alert" hidden>지도 연결 오류</div>

        <!-- Top-center search bar -->
        <div class="map-search-overlay">
          <form id="search-form" autocomplete="off">
            <div class="search-row">
              <input id="search" autocomplete="off" placeholder="주소, 지명 또는 좌표 (예: 37.5665, 126.978)" required maxlength="150">
              <button type="submit">검색</button>
            </div>
            <p id="search-message" class="feedback" role="status"></p>
            <ul id="search-results" class="search-results"></ul>
          </form>
        </div>

        <!-- Top-right result card -->
        <section class="result" aria-label="조회 결과">
          <div class="result-head">
            <div class="result-head-main">
              <span class="eyebrow">SELECTED LOCATION</span>
              <p id="region-location" class="region-location" role="status">지도에서 지점을 선택하세요.</p>
              <p id="coordinates">—</p>
            </div>
            <button id="toggle-dashboard" type="button" class="btn-dashboard" aria-expanded="true" aria-controls="result-body">
              <span aria-hidden="true" class="dash-icon">▦</span>
              <span class="dash-label">대시보드 접기</span>
            </button>
          </div>
          <div class="result-body" id="result-body">
            <div class="dashboard-period">
              <div class="dp-label">조회 기간</div>
              <div id="period-controls" class="period-range">
                <div><label for="period">시작 월</label><select id="period" disabled></select></div>
                <div><label for="period-to">종료 월</label><select id="period-to" disabled></select></div>
              </div>
            </div>
            <div id="multi-results" class="multi-results">
              <table aria-label="7종 데이터 통합 결과">
                <thead>
                  <tr>
                    <th scope="col">데이터</th>
                    <th scope="col">해상도</th>
                    <th scope="col">제공 기간</th>
                    <th scope="col">값</th>
                    <th scope="col" class="th-detail">상세</th>
                  </tr>
                </thead>
                <tbody id="multi-result-rows"></tbody>
              </table>
            </div>
            <p id="result-message" class="result-message" role="status"></p>
          </div>
        </section>
      </div>
      <footer class="source-footer"><span>출처: KIER · 배경지도: OpenStreetMap</span></footer>
    </div>
  </main>
</body></html>
